<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محمّل الفيديو — تيك توك ويوتيوب بدون علامة مائية</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0d0f14;--card:#161a22;--line:#262c38;--txt:#eef1f6;--mut:#8a93a6;--acc:#25f4ee;--acc2:#fe2c55}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;
       display:flex;flex-direction:column;align-items:center;padding:48px 16px}
  h1{font-size:clamp(28px,6vw,44px);font-weight:800;text-align:center;line-height:1.2}
  h1 span{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;color:transparent}
  .sub{color:var(--mut);margin:12px 0 32px;text-align:center}
  .box{width:100%;max-width:620px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
  .row{display:flex;gap:10px}
  input{flex:1;background:var(--bg);border:1px solid var(--line);color:var(--txt);border-radius:12px;
        padding:14px;font:inherit;direction:ltr;text-align:left}
  input:focus{outline:none;border-color:var(--acc)}
  button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:14px 20px;cursor:pointer}
  .go{background:linear-gradient(90deg,var(--acc),var(--acc2));color:#000}
  button:disabled{opacity:.5;cursor:wait}
  .msg{margin-top:14px;color:var(--acc2);min-height:1em;font-size:14px}
  .res{display:none;margin-top:18px;gap:14px;align-items:center}
  .res img{width:110px;height:110px;object-fit:cover;border-radius:12px;background:#000}
  .res h3{font-size:16px;margin-bottom:6px}
  .res small{color:var(--mut)}
  .btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .b1{background:var(--acc);color:#000}.b2{background:transparent;color:var(--txt);border:1px solid var(--line)}
  footer{margin-top:40px;color:var(--mut);font-size:13px;text-align:center;max-width:520px}
  @media(max-width:480px){.row{flex-direction:column}.res{flex-direction:column;text-align:center}}
</style>
</head>
<body>
  <h1>حمّل من <span>تيك توك</span> و<span>يوتيوب</span></h1>
  <p class="sub">الصق الرابط واحصل على الفيديو بدون علامة مائية — مجاناً وبسرعة</p>

  <div class="box">
    <div class="row">
      <input id="url" placeholder="https://www.tiktok.com/@user/video/..." autocomplete="off">
      <button class="go" id="go">جلب الفيديو</button>
    </div>
    <div class="msg" id="msg"></div>
    <div class="res" id="res">
      <img id="thumb" alt="">
      <div>
        <h3 id="title"></h3>
        <small id="meta"></small>
        <div class="btns">
          <button class="b1" id="ph">📸 حفظ في الصور</button>
          <button class="b2" id="dv">تحميل كملف MP4</button>
          <button class="b2" id="da">تحميل الصوت فقط</button>
        </div>
        <button class="b1" id="share" style="display:none;margin-top:10px;width:100%">✅ جاهز — اضغط هنا ثم اختر «حفظ الفيديو»</button>
        <a id="direct" target="_blank" rel="noopener" style="display:none;margin-top:10px;color:var(--acc);font-size:13px">لم يبدأ التحميل؟ افتح الفيديو مباشرة ثم احفظه</a>
      </div>
    </div>
  </div>

  <footer>للاستخدام الشخصي فقط. احترم حقوق أصحاب المحتوى ولا تُعِد نشر مقاطعهم دون إذن.</footer>

<script>
const $ = id => document.getElementById(id);
let current = "";
let tk = null; // بيانات تيك توك المجلوبة من المتصفح مباشرة

const full = u => !u ? null : (u.startsWith("http") ? u : "https://www.tikwm.com" + u);

// نجلب تيك توك من جوال المستخدم نفسه لأن تيك توك يحجب الخوادم
async function tikwmClient(url){
  const r = await fetch("https://www.tikwm.com/api/", {
    method: "POST",
    headers: {"Content-Type": "application/x-www-form-urlencoded"},
    body: "url=" + encodeURIComponent(url) + "&hd=1"
  });
  const j = await r.json();
  if(j.code !== 0 || !j.data) throw new Error(j.msg || "tikwm");
  const d = j.data;
  return {
    title: d.title || "TikTok", thumbnail: full(d.cover), duration: d.duration,
    uploader: (d.author || {}).nickname, platform: "TikTok", id: d.id || "video",
    video: full(d.hdplay) || full(d.play), audio: full(d.music)
  };
}

async function fetchInfo(){
  const url = $("url").value.trim();
  if(!url){ $("msg").textContent = "الصق رابطاً أولاً"; return; }
  $("go").disabled = true; $("msg").textContent = "جارٍ الجلب..."; $("res").style.display = "none";
  tk = null; readyFile = null;
  $("share").style.display = "none"; $("direct").style.display = "none";
  try{
    let d = null;
    if(/tiktok\.com\//i.test(url)){
      try{ d = tk = await tikwmClient(url); }catch(e){ console.log("tikwm client failed", e); }
    }
    if(!d){
      const r = await fetch("/api/info?url=" + encodeURIComponent(url));
      d = await r.json();
      if(!r.ok) throw new Error(d.error);
    }
    current = url;
    $("thumb").src = d.thumbnail || "";
    $("title").textContent = d.title || "بدون عنوان";
    const m = d.duration ? Math.floor(d.duration/60) + ":" + String(Math.round(d.duration%60)).padStart(2,"0") : "";
    $("meta").textContent = [d.platform, d.uploader, m].filter(Boolean).join(" • ");
    $("res").style.display = "flex"; $("msg").textContent = "";
  }catch(e){ $("msg").textContent = e.message || "حدث خطأ"; }
  $("go").disabled = false;
}

// يبني رابط التحميل من خادمنا (نفس النطاق، فلا مشاكل CORS)
function fileUrl(type){
  if(tk){
    const src = type === "audio" ? tk.audio : tk.video;
    if(src){
      const name = "tiktok_" + tk.id + (type === "audio" ? ".mp3" : ".mp4");
      $("direct").href = src; $("direct").style.display = "inline-block";
      return "/api/proxy?name=" + encodeURIComponent(name) + "&src=" + encodeURIComponent(src);
    }
  }
  return "/api/download?type=" + type + "&url=" + encodeURIComponent(current);
}

function dl(type){
  $("msg").textContent = "جارٍ تجهيز الملف، قد يستغرق ثوانٍ...";
  window.location.href = fileUrl(type);
  setTimeout(() => $("msg").textContent = "", 6000);
}

// الحفظ في الصور: نجهّز الفيديو أولاً، ثم نفتح قائمة المشاركة وفيها «حفظ الفيديو»
let readyFile = null;
async function toPhotos(){
  $("share").style.display = "none"; readyFile = null;
  $("ph").disabled = true;
  $("msg").textContent = "جارٍ تجهيز الفيديو للحفظ في الصور...";
  try{
    const r = await fetch(fileUrl("video"));
    if(!r.ok){ let e = "فشل التحميل"; try{ e = (await r.json()).error || e; }catch(_){} throw new Error(e); }
    const blob = await r.blob();
    const name = (tk ? "tiktok_" + tk.id : "video") + ".mp4";
    const file = new File([blob], name, {type: "video/mp4"});
    if(navigator.canShare && navigator.canShare({files: [file]})){
      readyFile = file;
      $("share").style.display = "block";
      $("msg").textContent = "";
    }else{
      // متصفح لا يدعم المشاركة: نحفظه كملف عادي
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = name; a.click();
      $("msg").textContent = "متصفحك لا يدعم الحفظ المباشر في الصور، فحُفظ كملف.";
    }
  }catch(e){ $("msg").textContent = e.message || "حدث خطأ"; }
  $("ph").disabled = false;
}

async function shareNow(){
  if(!readyFile) return;
  try{
    await navigator.share({files: [readyFile]});
    $("msg").textContent = "تم ✅ ستجد الفيديو في تطبيق الصور";
    $("share").style.display = "none";
  }catch(e){
    if(e.name !== "AbortError") $("msg").textContent = "تعذّر فتح قائمة المشاركة، حاول مرة أخرى.";
  }
}

$("go").onclick = fetchInfo;
$("url").addEventListener("keydown", e => e.key === "Enter" && fetchInfo());
$("dv").onclick = () => dl("video");
$("ph").onclick = toPhotos;
$("share").onclick = shareNow;
$("da").onclick = () => dl("audio");
</script>
</body>
</html>
